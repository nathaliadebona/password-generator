<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Password Generator</h1>
    </header>

    <main>
        <div id="password-box">
            <p id="password">senhaprovisoria</p>

            <button type="button" aria-label="copy"><i class="fa-regular fa-copy"></i></button>
        </div>

        <div id="password-generator">
            <form action="">
                <label for="character-length">Character Length</label>
                <p id="length-number">10</p>
                <input type="range" id="character-length" name="character-length" min="5" max="20" value="10">

                <input type="checkbox" id="uppercase" name="uppercase" checked>
                <label for="uppercase">Include Uppercase Letters</label>
                
                <input type="checkbox" id="lowercase" name="lowercase" checked>
                <label for="lowercase">Include Lowercase Letters</label>

                <input type="checkbox" id="numbers" name="numbers">
                <label for="numbers">Include Numbers</label>

                <input type="checkbox" id="symbols" name="symbols">
                <label for="symbols">Include Symbols</label>
            </form>

            <div id="strength">
                <p>STRENGTH</p>

                <span>MEDIUM</span>

                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
            </div>

            <button type="button">GENERATE <i class="fa-solid fa-angle-right"></i></button>
        </div>
    </main>

    <div id="info-message" aria-live="polite"></div>
</body>
</html>
